                <div key={i} className="card p-5">
                  <div className="flex items-start gap-4">
                    <span className={`w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-xs shrink-0 ${GM[i%6]}`}>{r.no}</span>
                    <div className="flex-1 min-w-0">
                      <h4 className="text-base font-black text-white leading-snug mb-1">{lang==='zh'?r.t_zh:lang==='ko'?r.t_ko:r.t_en}</h4>
                      <div className="flex flex-wrap gap-3 mb-3">
                        <span className="text-sm text-white/50 font-bold">📰 {lang==='zh'?r.s_zh:lang==='ko'?r.s_ko:r.s_en}</span>
                        <span className="text-sm text-white/30">🗓 {r.d}</span>
                      </div>
                      {r.u!=='#'&&(
                        <a href={r.u} target="_blank" rel="noopener noreferrer"
                          className="inline-flex items-center gap-2 text-sm font-black text-indigo-400 hover:text-indigo-300 bg-indigo-500/15 hover:bg-indigo-500/25 px-3 py-1.5 rounded-xl transition">
                          🔗 {t.ref_v} →
                        </a>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ═══ LOG ═══ */}
        {tab==='log'&&(
          <div className="space-y-8">
            <div>
              <h2 className="text-4xl font-black text-white mb-1">{t.log_t}</h2>
              <p className="text-sm text-white/45">{t.log_desc}</p>
            </div>
            {LOG.map((member,i)=>
              <div key={i} className="card p-7">
                <div className={`inline-block px-4 py-2 rounded-xl text-white font-black mb-4 ${GM[i%6]}`}>{member.m}</div>
                <div className="space-y-3">
                  {(member[lang]||member.ko).map((task,j)=>
                    <div key={j} className="ib p-4 flex gap-3">
                      <span className="text-indigo-400 font-black shrink-0">•</span>
                      <span className="text-white/80 leading-relaxed">{task}</span>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
