function BarChart({data, maxVal, colors}){
  return (
    <div className="space-y-2">
      {data.map((d,i)=>(
        <div key={i} className="flex items-center gap-3">
          <span className="text-xs font-black text-slate-500 w-10 shrink-0 text-right">{d.year}</span>
          <div className="flex-1 bar-bg">
            <div className={`bar-fill ${colors[i]||'bg-indigo-500'}`} style={{width:`${(d.val/maxVal)*100}%`}}/>
          </div>
          <span className="text-sm font-black text-slate-700 w-16 shrink-0 text-right">{d.val}</span>
        </div>
      ))}
    </div>
  );
}

function StatCard({icon,label,value,sub,gradient}){
  return (
    <div className={`card p-5 ${gradient||''}`}>
      <div className="text-2xl mb-2">{icon}</div>
      <div className="text-xs text-slate-400 font-bold mb-1">{label}</div>
      <div className="text-xl font-black text-slate-800">{value}</div>
      {sub && <div className="text-xs text-indigo-600 font-bold mt-1">{sub}</div>}
    </div>
  );
}

                    {t.strategy.inv_rating.risks.map((r,i)=>(
                      <div key={i} className="flex gap-2 items-start mb-1">
                        <span className="text-red-500 shrink-0 text-xs mt-0.5">›</span>
                        <span className="text-xs text-slate-700">{r}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Catalysts */}
            <div>
              <h3 className="text-xl font-black text-slate-800 mb-4">{t.strategy.catalyst_title}</h3>
              <div className="grid md:grid-cols-2 gap-4">
                {t.strategy.catalysts.map((c,i)=>(
                  <div key={i} className="card p-5 flex gap-4 items-start">
                    <span className="text-3xl shrink-0">{c.icon}</span>
                    <div>
                      <div className="font-black text-slate-800 mb-1">{c.t}</div>
                      <div className="text-sm text-slate-500">{c.d}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ══════════ REFERENCES ══════════ */}
        {tab==='refs' && (
          <div className="space-y-8">
            <div>
              <h2 className="text-3xl font-black text-slate-800 mb-1">{t.refs.title}</h2>
              <p className="text-slate-500">{t.refs.sub}</p>
            </div>
            <div className="note-amber border border-amber-200/40 rounded-2xl p-4">
              <p className="text-sm text-amber-800 font-bold">📝 {t.refs.note}</p>
            </div>
            <div className="space-y-3">
              {REFS.map((r,i)=>(
                <div key={i} className="refcard card p-5">
                  <div className="flex items-start gap-4">
                    <span className={`w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-xs shrink-0 ${GMAP[i%6]}`}>{r.no}</span>
                    <div className="flex-1 min-w-0">
                      <h4 className="font-black text-slate-800 text-sm leading-snug mb-1">{r.title}</h4>
                      <div className="flex flex-wrap gap-3 mb-3">
                        <span className="text-xs text-slate-500 font-bold">📰 {r.src}</span>
                        <span className="text-xs text-slate-400">🗓 {r.date}</span>
                      </div>
                      <a href={r.url} target="_blank" rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 text-xs font-black text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
                        🔗 {t.refs.visit} →
                      </a>
                      <div className="mt-1 text-xs text-slate-300 font-mono truncate">{r.url}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div className="card p-6">
              <h3 className="font-black text-lg text-slate-800 mb-4">📊 {t.refs.add_title}</h3>
              <div className="grid md:grid-cols-2 gap-2">
                {t.refs.add_sources.map((s,i)=>(
                  <div key={i} className="flex gap-2 items-start p-3 item-bg">
                    <span className="text-slate-400 shrink-0 text-xs mt-0.5 font-black">[{REFS.length+i+1}]</span>
                    <span className="text-xs text-slate-600">{s}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ══════════ PROJECT LOG ══════════ */}
        {tab==='log' && (
          <div className="space-y-8">
            <div>
              <h2 className="text-3xl font-black text-slate-800 mb-1">{t.log.title}</h2>
              <p className="text-slate-500">{t.log.sub}</p>
            </div>

            {/* Members */}
            <div className="space-y-5">
              {PROJ_LOG.map((m,i)=>(
                <div key={i} className="card overflow-hidden">
                  <div className={`${GMAP[i]} p-4 text-white flex items-center gap-4`}>
                    <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center font-black text-lg">{i+1}</div>
                    <div>
                      <div className="font-black text-lg">{m.member}</div>
                      <div className="text-white/70 text-xs">{t.log.role}</div>
                    </div>
                  </div>
                  <div className="p-5">
                    <ul className="space-y-2">
                      {(lang==='ko'?m.tasks_ko:lang==='en'?m.tasks_en:m.tasks_zh).map((task,j)=>(
                        <li key={j} className="flex gap-3 items-start">
                          <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-black shrink-0 mt-0.5">{j+1}</span>
                          <span className="text-sm text-slate-600">{task}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              ))}
            </div>

            {/* Timeline */}
            <div>
              <h3 className="text-xl font-black text-slate-800 mb-5">{lang==='en'?'Project Timeline':lang==='ko'?'프로젝트 타임라인':'專案時程'}</h3>
              <div className="card overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-slate-800 text-white">
                      <th className="text-left px-5 py-3 font-black">{lang==='en'?'Phase':lang==='ko'?'단계':'階段'}</th>
                      <th className="text-left px-5 py-3 font-black">{lang==='en'?'Period':lang==='ko'?'기간':'期間'}</th>
                      <th className="text-left px-5 py-3 font-black">{lang==='en'?'Deliverable':lang==='ko'?'결과물':'交付內容'}</th>
                      <th className="text-center px-5 py-3 font-black">{lang==='en'?'Owner':lang==='ko'?'담당':'負責'}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {t.log.phases.map((ph,i)=>{
                      const isMile = ph.ph==='Proposal'||ph.ph==='Final'||ph.ph==='최종 발표';
                      return(
                        <tr key={i} className={`${isMile?'bg-indigo-50':i%2===0?'bg-white':'bg-slate-50'} hover:bg-indigo-50 transition`}>
                          <td className="px-5 py-3">
                            <span className={`bdg ${isMile?'bg-indigo-600 text-white':'bg-slate-100 text-slate-600'}`}>{ph.ph}</span>
                          </td>
                          <td className="px-5 py-3 font-bold text-slate-700">📅 {ph.period}</td>
                          <td className="px-5 py-3 text-slate-600">{ph.task}</td>
                          <td className="px-5 py-3 text-center">
                            <span className="bdg bg-slate-100 text-slate-600">ALL</span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

      </div>

      {/* FOOTER */}
      <footer className="mt-16 bg-slate-800 text-white px-6 py-8">
        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <div className="font-black text-lg">{t.ft_title}</div>
            <div className="text-xs text-slate-400 mt-1">{t.ft_sub}</div>
          </div>
          <div className="flex gap-2 flex-wrap justify-center">
            <span className="bdg bg-indigo-600 text-white">{lang==='en'?'CFO Perspective':lang==='ko'?'CFO 시각':'CFO 視角'}</span>
            <span className="bdg bg-cyan-600 text-white">DCF + SOTP</span>
            <span className="bdg bg-emerald-600 text-white">BD Nasdaq IPO</span>
            <span className="bdg bg-amber-500 text-white">{lang==='en'?'BUY':lang==='ko'?'매수':'買入'} KRW 130~150K</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
